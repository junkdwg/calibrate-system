{% extends "calibration/base.html" %}
{% block content %}
<div class="card" style="max-width:380px;margin:3rem auto">
  <h2>เข้าสู่ระบบ</h2>
  {% if form.errors %}<p class="err">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</p>{% endif %}
  <form method="post">{% csrf_token %}
    <p><label>ชื่อผู้ใช้</label>{{ form.username }}</p>
    <p><label>รหัสผ่าน</label>{{ form.password }}</p>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">เข้าสู่ระบบ</button>
  </form>
</div>
{% endblock %}
